# System nginx server block for seller-bot.example.com
# Place at: /etc/nginx/sites-available/seller-bot.example.com
#   sudo ln -s /etc/nginx/sites-available/seller-bot.example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d seller-bot.example.com   # adds the 443 block + auto-redirect

server {
    listen 80;
    server_name seller-bot.example.com;

    client_max_body_size 100m;   # large document uploads from the admin «Диалоги»

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # LLM replies / gateway calls can be slow
    }
}

