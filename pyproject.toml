[project]
name = "sellerbot"
version = "0.1.0"
description = "Telegram sales-bot engine with admin panel (Kazakhstan)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI uses function calls (Depends/Form) in argument defaults by design.
# RUF001-003 not selected — Cyrillic in UI strings is intentional.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Промпты для модели — связный текст, который читают и правят люди из отдела
# продаж. Ломать его по 100 символов ради линтера значит испортить то, ради чего
# он написан, поэтому длина строки здесь не проверяется.
"app/services/jobs.py" = ["E501"]
