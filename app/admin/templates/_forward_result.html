{% if sent %}
<div class="rounded-lg bg-green-50 border border-green-200 text-green-700 px-3 py-2 text-sm">
  ✓ Переслано в {{ sent }} чат{% if sent < total %} из {{ total }}{% endif %}.
</div>
{% else %}
<div class="rounded-lg bg-red-50 border border-red-200 text-red-700 px-3 py-2 text-sm">
  Не удалось переслать — выберите хотя бы один контакт.
</div>
{% endif %}
